name: Release

on:
  push:
    tags:
      - 'v*'

jobs:

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Configure
        run: cmake -H. -B_build

      - name: Build packages
        run: |
          cd _build
          cpack -G TGZ
          cpack -G DEB
          cpack -G RPM

      - name: Release Linux Packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            _build/*.tar.gz
            _build/*.deb
            _build/*.rpm

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Configure
        run: cmake -B_build

      - name: Build MSI
        run: |
          cd _build
          cpack -G WIX

      - name: Release MSI
        uses: softprops/action-gh-release@v1
        with:
          files: _build/*.msi

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Configure
        run: cmake -B_build

      - name: Build DMG
        run: |
          cd _build
          cpack -G DragNDrop

      - name: Release DMG
        uses: softprops/action-gh-release@v1
        with:
          files: _build/*.dmg
